<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101416">
  <link rel="icon" href="data:,">
  <title>模型共识榜</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0d1113;
      --surface:#151b1e;
      --surface-2:#1b2327;
      --line:#344047;
      --text:#edf2f4;
      --muted:#9ba9af;
      --cyan:#67d7dc;
      --red:#ef6666;
      --green:#3fc28b;
      --amber:#e4b95c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      letter-spacing:0;
    }
    button{font:inherit}
    .top{
      min-height:92px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;
      gap:20px;padding:18px max(20px,calc((100vw - 1180px)/2));
      background:#111719;
    }
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brand-mark{
      width:42px;height:42px;border:1px solid #477078;border-radius:6px;
      display:grid;place-items:center;color:var(--cyan);font-size:23px;
      background:#162326;flex:0 0 auto;
    }
    .eyebrow{font-size:11px;color:#91a8ae;letter-spacing:2px}
    h1{font-size:27px;line-height:1.15;margin:2px 0 0;color:var(--cyan)}
    h2,h3,p{margin:0}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
    .generated{font-size:12px;color:var(--muted);text-align:right}
    .refresh{
      width:38px;height:38px;padding:0;border:1px solid var(--line);
      border-radius:6px;background:var(--surface-2);color:var(--text);
      cursor:pointer;font-size:19px;
    }
    .refresh:hover{border-color:var(--cyan)}
    .refresh:disabled{opacity:.55;cursor:wait}
    main{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
    .board-head{
      display:flex;justify-content:space-between;align-items:flex-end;
      gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line);
    }
    .board-head h2{font-size:21px}
    .board-head p{margin-top:5px;color:var(--muted);font-size:13px}
    .state{
      border:1px solid #41666c;border-radius:5px;padding:5px 9px;
      color:var(--cyan);font-size:12px;white-space:nowrap;
    }
    .state.waiting{color:var(--amber);border-color:#6f603d}
    .metrics{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
      border-bottom:1px solid var(--line);
    }
    .metric{padding:18px 16px;border-right:1px solid var(--line)}
    .metric:last-child{border-right:0}
    .metric span{display:block;color:var(--muted);font-size:12px}
    .metric strong{display:block;margin-top:4px;font-size:23px;font-variant-numeric:tabular-nums}
    .section{padding-top:24px}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:12px}
    .section-head h3{font-size:16px}
    .section-head span{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .stock{
      border:1px solid var(--line);border-radius:6px;background:var(--surface);
      padding:15px;min-width:0;
    }
    .stock.alt{border-style:dashed}
    .stock-top{display:flex;align-items:center;gap:10px;min-width:0}
    .rank{
      min-width:52px;color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums;
    }
    .name{font-size:17px;font-weight:700;overflow-wrap:anywhere}
    .code{color:var(--muted);font-variant-numeric:tabular-nums}
    .signal{
      margin-left:auto;color:var(--red);font-weight:700;white-space:nowrap;
    }
    .facts{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;margin-top:13px;
    }
    .fact{padding:9px;background:var(--surface-2);border-radius:4px;min-width:0}
    .fact span{display:block;color:var(--muted);font-size:11px}
    .fact b{display:block;margin-top:3px;font-size:14px;overflow-wrap:anywhere}
    .up{color:var(--red)}
    .models{margin-top:11px;color:#c8d2d6;font-size:12px;overflow-wrap:anywhere}
    .empty{
      padding:34px 18px;border:1px dashed var(--line);border-radius:6px;
      color:var(--muted);text-align:center;background:var(--surface);
    }
    .foot{
      margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px;display:flex;justify-content:space-between;
      gap:18px;flex-wrap:wrap;
    }
    @media(max-width:760px){
      .top{align-items:flex-start;padding:16px}
      .actions{gap:8px}.generated{max-width:190px}
      main{padding:18px 12px 36px}
      .board-head{align-items:flex-start}
      .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
      .metric:nth-child(2){border-right:0}
      .metric:nth-child(-n+2){border-bottom:1px solid var(--line)}
      .grid{grid-template-columns:1fr}
      .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">∩</div>
      <div>
        <div class="eyebrow">AWAKENING / QUANT</div>
        <h1>模型共识榜</h1>
      </div>
    </div>
    <div class="actions">
      <div id="generated" class="generated" role="status">正在读取数据</div>
      <button id="refresh" class="refresh" type="button" title="刷新" aria-label="刷新">↻</button>
    </div>
  </header>

  <main>
    <section class="board-head">
      <div>
        <h2 id="board-date">最近交易日</h2>
        <p>模型最终选股与当日分钟级多头信号的交集</p>
      </div>
      <span id="board-state" class="state waiting">读取中</span>
    </section>

    <section class="metrics" aria-label="共识统计">
      <div class="metric"><span>参与模型</span><strong id="model-count">--</strong></div>
      <div class="metric"><span>模型入选股票</span><strong id="selection-count">--</strong></div>
      <div class="metric"><span>同时出现多头</span><strong id="matched-count">--</strong></div>
      <div class="metric"><span>最终入榜</span><strong id="board-count">--</strong></div>
    </section>

    <section class="section" aria-labelledby="primary-title">
      <div class="section-head">
        <h3 id="primary-title">主榜</h3>
        <span id="primary-rule">至少 3 个模型选中</span>
      </div>
      <div id="primary-grid" class="grid"></div>
    </section>

    <section class="section" aria-labelledby="alternate-title">
      <div class="section-head">
        <h3 id="alternate-title">候补</h3>
        <span id="alternate-rule">至少 2 个模型选中</span>
      </div>
      <div id="alternate-grid" class="grid"></div>
    </section>

    <footer class="foot">
      <span id="frozen-at">模型名单冻结 --</span>
      <span id="signal-through">多头信号观测 --</span>
    </footer>
  </main>

  <script>
    'use strict';
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    const time = value => value
      ? String(value).replace('T', ' ').replace(/\+08:00$/, '') : '--';
    const pct = value => Number.isFinite(Number(value))
      ? `${Number(value) >= 0 ? '+' : ''}${(Number(value) * 100).toFixed(2)}%`
      : '--';
    const sourceName = value =>
      value === 'tencent' ? '腾讯' : value === 'sina' ? '新浪' : value || '--';
    const stateName = {
      ready: '已就绪',
      empty: '无符合项',
      waiting_selection: '等待模型名单',
      waiting_long_signal: '等待多头信号',
    };
    let etag = '';

    function card(row) {
      const signal = row.long_signal || {};
      const modelText = (row.ballots || [])
        .map(item => `${esc(item.name || item.model)} #${item.rank}`)
        .join(' · ');
      const tier = row.tier === 'primary' ? 'Top' : '候补';
      return `<article class="stock ${row.tier === 'alternate' ? 'alt' : ''}">
        <div class="stock-top">
          <span class="rank">${tier}${row.tier_rank}</span>
          <span class="name">${esc(row.name)}</span>
          <span class="code">${esc(row.code)}</span>
          <span class="signal">${signal.strength === 'weak' ? '涨' : '多'}</span>
        </div>
        <div class="facts">
          <div class="fact"><span>模型共识</span><b>${row.votes} 票 · ${(Number(row.vote_share) * 100).toFixed(0)}%</b></div>
          <div class="fact"><span>首次多头</span><b>${esc(time(signal.quote_at).slice(11, 19))}</b></div>
          <div class="fact"><span>信号价格</span><b>¥${Number(signal.price).toFixed(2)}</b></div>
          <div class="fact"><span>信号涨幅</span><b class="${Number(signal.change) >= 0 ? 'up' : ''}">${pct(signal.change)}</b></div>
          <div class="fact"><span>信号概率</span><b>${(Number(signal.probability) * 100).toFixed(1)}%</b></div>
          <div class="fact"><span>行情来源</span><b>${esc(sourceName(signal.source))}</b></div>
        </div>
        <p class="models">提名：${modelText || '--'}</p>
      </article>`;
    }

    function render(data) {
      if (data?.schema !== 'awakening-consensus-dashboard-v1') {
        throw new Error('数据结构不兼容');
      }
      const board = data.board || {};
      const policy = data.policy || {};
      const rows = board.rows || [];
      const primary = rows.filter(row => row.tier === 'primary');
      const alternates = rows.filter(row => row.tier === 'alternate');
      $('#generated').textContent = `快照 ${time(data.generated)}`;
      $('#board-date').textContent = board.date
        ? `${board.date.slice(0, 4)}-${board.date.slice(4, 6)}-${board.date.slice(6)} 模型共识榜`
        : '最近交易日模型共识榜';
      $('#board-state').textContent = stateName[board.status] || board.status || '未知';
      $('#board-state').classList.toggle('waiting', board.status !== 'ready');
      $('#model-count').textContent = `${board.model_count || 0}`;
      $('#selection-count').textContent = `${board.model_selection_count || 0}`;
      $('#matched-count').textContent = `${board.matched_long_count || 0}`;
      $('#board-count').textContent =
        `${board.primary_count || 0} + ${board.alternate_count || 0}`;
      $('#primary-rule').textContent =
        `最多 ${policy.primary_limit || 5} 只 · 至少 ${policy.primary_min_votes || 3} 票`;
      $('#alternate-rule').textContent =
        `最多 ${policy.alternate_limit || 2} 只 · 至少 ${policy.alternate_min_votes || 2} 票`;
      $('#primary-grid').innerHTML = primary.length
        ? primary.map(card).join('')
        : `<div class="empty">${esc(board.reason || '暂无满足条件的主榜股票')}</div>`;
      $('#alternate-grid').innerHTML = alternates.length
        ? alternates.map(card).join('')
        : '<div class="empty">暂无满足条件的候补股票</div>';
      $('#frozen-at').textContent = `模型名单冻结 ${time(board.frozen_at)}`;
      $('#signal-through').textContent =
        `多头信号观测至 ${time(board.signal_observed_through)}`;
    }

    async function refresh() {
      const button = $('#refresh');
      button.disabled = true;
      try {
        const headers = etag ? {'If-None-Match': etag} : {};
        let response = await fetch('data.json', {
          cache: 'no-cache', headers,
        });
        if (!response.ok && location.hostname === '127.0.0.1') {
          response = await fetch('/api/data', {cache: 'no-store'});
        }
        if (response.status === 304) return;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        etag = response.headers.get('ETag') || '';
        render(await response.json());
      } catch (error) {
        $('#generated').textContent = `刷新失败 · ${String(error)}`;
      } finally {
        button.disabled = false;
      }
    }

    $('#refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
