<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101416">
  <link rel="icon" href="data:,">
  <title>量化交易</title>
  <script src="echarts.min.js"></script>
  <style>
    :root{
      color-scheme:dark;--bg:#0d1113;--surface:#151b1e;--surface2:#1b2327;
      --line:#344047;--text:#edf2f4;--muted:#9ba9af;--cyan:#67d7dc;
      --red:#ef6666;--green:#3fc28b;--amber:#e4b95c;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      letter-spacing:0}
    button,input{font:inherit}
    button{cursor:pointer}
    .top{min-height:92px;border-bottom:1px solid var(--line);display:flex;
      align-items:center;justify-content:space-between;gap:20px;
      padding:18px max(20px,calc((100vw - 1180px)/2));background:#111719}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brand-mark{width:42px;height:42px;border:1px solid #477078;border-radius:6px;
      display:grid;place-items:center;color:var(--cyan);font-size:23px;
      background:#162326;flex:0 0 auto}
    .eyebrow{font-size:11px;color:#91a8ae;letter-spacing:2px}
    h1{font-size:27px;line-height:1.15;margin:2px 0 0;color:var(--cyan)}
    h2,h3,p{margin:0}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
    .generated{font-size:12px;color:var(--muted);text-align:right}
    .icon-btn{width:38px;height:38px;padding:0;border:1px solid var(--line);
      border-radius:6px;background:var(--surface2);color:var(--text);font-size:19px}
    .icon-btn:hover,.stock-link:hover{border-color:var(--cyan);color:var(--cyan)}
    .icon-btn:disabled{opacity:.55;cursor:wait}
    main{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
    .section-head{display:flex;justify-content:space-between;
      align-items:flex-end;gap:18px}
    .section-head span{margin-top:5px;color:var(--muted);font-size:13px}
    .date-control{display:flex;align-items:center;gap:8px;color:var(--muted);
      font-size:12px}
    .date-control select{height:38px;border:1px solid var(--line);border-radius:5px;
      background:var(--surface2);color:var(--text);padding:0 30px 0 10px}
    .date-control select:disabled{opacity:.55}
    .section{padding-top:4px}
    .section-head{margin-bottom:12px}
    .section-head h2{font-size:21px}
    .up{color:var(--red)}.down{color:var(--green)}
    .models{margin-top:11px;color:#c8d2d6;font-size:12px;overflow-wrap:anywhere}
    .consensus-section{padding-bottom:26px;margin-bottom:24px;border-bottom:1px solid var(--line)}
    .board-meta{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);
      font-size:13px;margin-bottom:14px}
    .board-meta strong{color:var(--text);font-variant-numeric:tabular-nums}
    .board-group{margin-top:16px}
    .board-group h3{font-size:14px;margin-bottom:9px;color:#d9e2e5}
    .board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:10px}
    .consensus-card{min-width:0;border:1px solid var(--line);border-radius:6px;
      padding:13px 14px;background:var(--surface)}
    .consensus-card.primary{border-left:3px solid var(--red)}
    .consensus-card.alternate{border-left:3px solid var(--amber)}
    .consensus-top{display:flex;align-items:center;gap:8px;min-width:0}
    .rank{color:var(--muted);font-size:12px;flex:0 0 auto}
    .consensus-name{font-weight:700;color:var(--text);text-decoration:none;
      border:0;background:none;padding:0;min-width:0}
    .consensus-code{color:var(--muted);font-size:12px}
    .vote{margin-left:auto;color:var(--cyan);font-weight:700;font-size:12px}
    .vote-track{height:4px;background:#263137;margin:10px 0 8px;overflow:hidden}
    .vote-track span{display:block;height:100%;background:var(--cyan)}
    .signal-line{font-size:12px;color:#c8d2d6}
    .ballots{font-size:11px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
    .empty{padding:34px 18px;border:1px dashed var(--line);border-radius:6px;
      color:var(--muted);text-align:center;background:var(--surface)}
    .signal-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .search{height:38px;width:min(260px,70vw);border:1px solid var(--line);
      border-radius:5px;background:var(--surface2);color:var(--text);padding:0 10px}
    .segmented{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
    .segmented button{height:36px;border:0;border-right:1px solid var(--line);
      border-radius:0;background:var(--surface2);color:var(--muted);padding:0 13px}
    .segmented button:last-child{border-right:0}
    .segmented button.active{background:#245b61;color:white}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
    table{width:100%;border-collapse:collapse;min-width:1420px}
    th,td{padding:10px 12px;border-bottom:1px solid #283238;text-align:right;
      white-space:nowrap;font-variant-numeric:tabular-nums}
    th{position:sticky;top:0;background:#172024;color:var(--muted);font-size:12px}
    th:nth-child(2),th:nth-child(3),th:nth-child(4),
    td:nth-child(2),td:nth-child(3),td:nth-child(4){text-align:left}
    tbody tr:last-child td{border-bottom:0}
    tbody tr.vanished{background:rgba(228,185,92,.07)}
    .badge{display:inline-block;border:1px solid #806c3d;border-radius:4px;
      color:var(--amber);padding:2px 6px;font-size:11px}
    .stock-link{border:0;background:none;padding:0;color:#9edce0;text-decoration:underline;
      text-underline-offset:3px}
    .pagination{display:flex;align-items:center;justify-content:flex-end;
      gap:10px;margin-top:12px;color:var(--muted)}
    .pagination button{border:1px solid var(--line);border-radius:5px;
      background:var(--surface2);color:var(--text);padding:7px 12px}
    .pagination button:disabled{opacity:.45;cursor:not-allowed}
    .foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
      color:var(--muted);font-size:12px;display:flex;justify-content:space-between;
      gap:18px;flex-wrap:wrap}
    dialog{width:min(1000px,96vw);max-height:94vh;max-height:94dvh;margin:auto;
      overflow:auto;border:1px solid var(--line);border-radius:7px;
      background:#101719;color:var(--text);padding:18px}
    dialog::backdrop{background:rgba(0,0,0,.74)}
    .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
    .dialog-head h2{font-size:21px}
    .stock-meta{color:var(--muted);margin-top:5px;font-size:12px;line-height:1.7}
    .stock-meta strong{color:var(--text);font-weight:600}
    .dialog-tabs{margin:14px 0;display:flex;gap:4px}
    .dialog-tabs button{border:1px solid var(--line);border-radius:5px;
      background:var(--surface2);color:var(--muted);padding:7px 14px}
    .dialog-tabs button.active{color:white;background:#245b61}
    .chart{height:440px;width:100%}
    .chart-status{color:var(--muted);font-size:12px;margin-top:8px}
    @media(max-width:760px){
      .top{align-items:flex-start;padding:16px}.actions{gap:8px}.generated{max-width:190px}
      main{padding:18px 12px 36px}.section-head{align-items:flex-start;flex-direction:column}
      .signal-tools{width:100%}.search{width:100%}.chart{height:350px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">∩</div>
      <div><div class="eyebrow">AWAKENING / QUANT</div><h1>量化交易</h1></div>
    </div>
    <div class="actions">
      <div id="generated" class="generated" role="status">正在读取数据</div>
      <button id="refresh" class="icon-btn" type="button" title="刷新" aria-label="刷新">↻</button>
    </div>
  </header>

  <main>
    <section id="consensus-section" class="consensus-section"
      aria-labelledby="consensus-title">
      <div class="section-head">
        <div>
          <h2 id="consensus-title">模型共识 × 当日多头信号</h2>
          <span id="consensus-count">--</span>
        </div>
        <label class="date-control">交易日
          <select id="date-select" aria-label="选择交易日"></select>
        </label>
      </div>
      <div id="board-summary" class="board-meta"></div>
      <div class="board-group">
        <h3>主榜</h3>
        <div id="primary-grid" class="board-grid"></div>
      </div>
      <div class="board-group">
        <h3>候补榜</h3>
        <div id="alternate-grid" class="board-grid"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="signals-title">
      <div class="section-head">
        <div>
          <h2 id="signals-title">所选交易日全部信号</h2>
          <span id="signals-count">--</span>
        </div>
        <div class="signal-tools">
          <input id="signal-search" class="search" type="search"
            placeholder="代码或名称" aria-label="搜索信号股票">
          <div class="segmented" role="tablist" aria-label="信号方向">
            <button class="active" type="button" data-direction="all"
              role="tab" aria-selected="true">全部</button>
            <button type="button" data-direction="long"
              role="tab" aria-selected="false">多头</button>
            <button type="button" data-direction="short"
              role="tab" aria-selected="false">空头</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table id="signals-table"></table>
      </div>
      <div class="pagination">
        <button id="signal-prev" type="button">上一页</button>
        <span id="signal-page">--</span>
        <button id="signal-next" type="button">下一页</button>
      </div>
    </section>

    <footer class="foot">
      <span id="signal-date">交易日 --</span>
      <span id="signal-through">多空信号观测 --</span>
      <span id="consensus-policy">共识口径 --</span>
    </footer>
  </main>

  <dialog id="stock-dialog" aria-labelledby="stock-title">
    <div class="dialog-head">
      <div><h2 id="stock-title">股票行情</h2><div id="stock-code" class="stock-meta"></div></div>
      <button id="stock-close" class="icon-btn" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <div class="dialog-tabs" role="tablist" aria-label="行情周期">
      <button id="minute-tab" class="active" type="button"
        role="tab" aria-selected="true">分时</button>
      <button id="daily-tab" type="button"
        role="tab" aria-selected="false">日K</button>
    </div>
    <div id="stock-chart" class="chart"></div>
    <p id="chart-status" class="chart-status">正在读取行情</p>
  </dialog>

  <script>
    'use strict';
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    const stamp = value => value
      ? String(value).replace('T', ' ').replace(/\+08:00$/, '') : '--';
    const clock = value => {
      const match = String(value || '').match(/T(\d{2}):(\d{2}):(\d{2})/);
      return match ? `${match[1]}:${match[2]}:${match[3]}` : '--';
    };
    const pct = value => Number.isFinite(Number(value))
      ? `${Number(value) >= 0 ? '+' : ''}${(Number(value) * 100).toFixed(2)}%`
      : '--';
    const price = value => Number.isFinite(Number(value))
      ? `¥${Number(value).toFixed(2)}` : '--';
    const sourceName = value =>
      value === 'tencent' ? '腾讯' : value === 'sina' ? '新浪' : value || '--';
    const signalColors = {
      strongLong:'#ef6666',weakLong:'#ef6666',
      strongShort:'#3fc28b',weakShort:'#3fc28b',
    };
    const signalLabel = (direction, strength) => {
      const long = Number(direction) === 1;
      return strength === 'weak'
        ? (long ? '涨' : '跌')
        : (long ? '多' : '空');
    };
    const axis = {
      axisLine: {lineStyle: {color: '#425058'}},
      axisLabel: {color: '#9ba9af'},
      splitLine: {lineStyle: {color: '#263137'}},
    };
    let DATA = null;
    const DATE_CACHE = new Map();
    let activeDate = '';
    let etag = '';
    let direction = 'all';
    let signalPage = 1;
    const signalPageSize = 100;
    let stockState = null;
    let stockChart = null;
    let stockController = null;

    function filteredSignals() {
      const query = $('#signal-search').value.trim().toLowerCase();
      return (DATA.signals?.rows || []).filter(row => {
        if (direction === 'long' && row.direction !== 1) return false;
        if (direction === 'short' && row.direction !== -1) return false;
        return !query || `${row.code}${row.name}`.toLowerCase().includes(query);
      });
    }
    function renderSignals() {
      const rows = filteredSignals();
      const pages = Math.max(1, Math.ceil(rows.length / signalPageSize));
      signalPage = Math.min(signalPage, pages);
      const shown = rows.slice(
        (signalPage - 1) * signalPageSize,
        signalPage * signalPageSize);
      const summary = DATA.signals || {};
      $('#signals-count').textContent =
        `股票 ${summary.stock_count || 0} 只 · 信号 ${summary.count || 0} 条 · 多头 ${summary.long_count || 0} · 空头 ${summary.short_count || 0} · 收盘消失 ${summary.disappeared_count || 0} · 当前筛选 ${rows.length}`;
      $('#signals-table').innerHTML = `<thead><tr>
        <th>方向</th><th>时间</th><th>代码</th><th>名称</th>
        <th>强度</th><th>信号价</th><th>信号时涨跌</th>
        <th>收盘价</th><th>收盘涨跌</th><th>信号至收盘</th>
        <th>最高 / 最低</th><th>最大涨 / 跌</th><th>收盘状态</th>
        <th>概率</th><th>行业/板块</th><th>来源</th>
      </tr></thead><tbody>${shown.length ? shown.map(row => {
        const long = row.direction === 1;
        return `<tr class="${row.disappeared_at_close ? 'vanished' : ''}">
          <td class="${long ? 'up' : 'down'}">${long ? '多' : '空'}</td>
          <td>${esc(clock(row.quote_at))}</td>
          <td><button class="stock-link" data-code="${esc(row.code)}">${esc(row.code)}</button></td>
          <td><button class="stock-link" data-code="${esc(row.code)}">${esc(row.name)}</button></td>
          <td>${row.strength === 'weak' ? '弱' : '强'}</td>
          <td>${price(row.price)}</td>
          <td class="${Number(row.change) >= 0 ? 'up' : 'down'}">${pct(row.change)}</td>
          <td>${price(row.close_price)}</td>
          <td class="${Number(row.close_change) >= 0 ? 'up' : 'down'}">${pct(row.close_change)}</td>
          <td class="${Number(row.signal_to_close) >= 0 ? 'up' : 'down'}">${pct(row.signal_to_close)}</td>
          <td>${price(row.high)} / ${price(row.low)}</td>
          <td><span class="up">${pct(row.max_rise)}</span> / <span class="down">${pct(row.max_decline)}</span></td>
          <td>${row.disappeared_at_close
            ? `<span class="badge">${long ? '多头' : '空头'}已消失</span>`
            : (row.close_complete ? `${long ? '多头' : '空头'}仍在` : '盘中')}</td>
          <td>${(Number(row.probability) * 100).toFixed(1)}%</td>
          <td>${esc(String(row.industry || '').replace(/^[A-Z]\d{2}/, '') || '--')}</td>
          <td>${esc(sourceName(row.source))}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="16" class="empty">当前筛选没有信号</td></tr>'}</tbody>`;
      $('#signal-page').textContent = `${signalPage} / ${pages}`;
      $('#signal-prev').disabled = signalPage <= 1;
      $('#signal-next').disabled = signalPage >= pages;
    }

    function stockSignals(code) {
      return (DATA.signals?.rows || []).filter(row =>
        row.code === code && row.direction !== 0);
    }

    function consensusCard(row, tier) {
      const signal = row.signal || {};
      const ballots = (row.ballots || []).map(ballot =>
        `${esc(ballot.model_name || ballot.model)} #${ballot.rank}`).join(' · ');
      const share = Math.max(0, Math.min(100,
        Number(row.vote_share || 0) * 100));
      return `<article class="consensus-card ${tier}">
        <div class="consensus-top">
          <span class="rank">${tier === 'primary' ? 'Top' : '候补'} ${row.rank}</span>
          <button class="consensus-name" type="button"
            data-code="${esc(row.code)}">${esc(row.name)}</button>
          <span class="consensus-code">${esc(row.code)}</span>
          <span class="vote">${row.votes}/${DATA.board.model_count} 票</span>
        </div>
        <div class="vote-track" aria-hidden="true"><span style="width:${share}%"></span></div>
        <p class="signal-line">多头 ${esc(clock(signal.quote_at))} ·
          ${price(signal.price)} ·
          <span class="${Number(signal.change) >= 0 ? 'up' : 'down'}">${pct(signal.change)}</span>
          · Borda ${row.borda_points}</p>
        <p class="ballots">${ballots || '--'}</p>
      </article>`;
    }

    function renderConsensus() {
      const board = DATA.board || {};
      const policy = DATA.policy || {};
      const ready = board.status === 'ready';
      const primary = ready && Array.isArray(board.primary) ? board.primary : [];
      const alternates = ready && Array.isArray(board.alternates)
        ? board.alternates : [];
      $('#consensus-count').textContent = ready
        ? `主榜 ${primary.length} 只 · 候补 ${alternates.length} 只`
        : '等待同日模型最终名单与多头信号';
      $('#board-summary').innerHTML = ready
        ? `<span>模型 <strong>${board.model_count}</strong></span>
          <span>交集候选 <strong>${board.candidate_count}</strong></span>
          <span>主榜门槛 <strong>${policy.primary_min_votes} 票</strong></span>
          <span>候补门槛 <strong>${policy.alternate_min_votes} 票</strong></span>`
        : '';
      $('#primary-grid').innerHTML = ready
        ? (primary.length
          ? primary.map(row => consensusCard(row, 'primary')).join('')
          : '<div class="empty">当天没有股票同时达到主榜共识和多头信号门槛</div>')
        : '<div class="empty">同日数据尚未完整冻结</div>';
      $('#alternate-grid').innerHTML = ready
        ? (alternates.length
          ? alternates.map(row => consensusCard(row, 'alternate')).join('')
          : '<div class="empty">当天没有达到候补门槛的交集股票</div>')
        : '<div class="empty">同日数据尚未完整冻结</div>';
      $('#consensus-policy').textContent =
        `每模型最终 Top${policy.vote_limit_per_strategy || 10}`
        + ` ∩ 当日多头 · 主榜≥${policy.primary_min_votes || 3}票`
        + ` · 候补≥${policy.alternate_min_votes || 2}票`;
    }

    function parseMinute(
        payload, symbol, date, previousClose, targetClose = null) {
      const days = payload?.data?.[symbol]?.data;
      const target = Array.isArray(days)
        ? days.find(item => String(item?.date || '') === date)
        : null;
      if (payload?.code !== 0 || !target || !Array.isArray(target.data)) {
        throw new Error('腾讯最近5个交易日无该日分钟数据');
      }
      let priorVolume = 0;
      const points = [];
      for (const raw of target.data) {
        if (typeof raw !== 'string') continue;
        const [time, closeRaw, volumeRaw, amountRaw] = raw.trim().split(/\s+/);
        const regular = /^\d{4}$/.test(time)
          && (('0930' <= time && time <= '1130')
            || ('1300' <= time && time <= '1500'));
        const close = Number(closeRaw);
        const cumulativeVolume = Number(volumeRaw);
        const cumulativeAmount = Number(amountRaw);
        if (!regular || !Number.isFinite(close) || close <= 0
            || !Number.isFinite(cumulativeVolume)
            || cumulativeVolume < priorVolume) continue;
        const volume = (cumulativeVolume - priorVolume) * 100;
        const average = Number.isFinite(cumulativeAmount) && cumulativeVolume > 0
          ? cumulativeAmount / (cumulativeVolume * 100) : null;
        points.push([time, close, volume, average]);
        priorVolume = cumulativeVolume;
      }
      if (!points.length || !Number.isFinite(previousClose) || previousClose <= 0) {
        throw new Error('分钟行情数据不完整');
      }
      const factor = Number.isFinite(Number(targetClose))
        && Number(targetClose) > 0
        ? Number(targetClose) / points.at(-1)[1] : 1;
      const adjusted = factor === 1 ? points : points.map(row => [
        row[0],row[1] * factor,row[2],
        Number.isFinite(row[3]) ? row[3] * factor : null,
      ]);
      return {
        date:`${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6)}`,
        previousClose,points:adjusted,source:'腾讯在线1分钟价量',
      };
    }

    function parsePersistedMinutes(payload, code) {
      if (payload?.schema !== 'awakening-trend-live-stock-v1'
          || payload.code !== code || !Array.isArray(payload.days)) {
        throw new Error('本地分钟快照不完整');
      }
      return payload.days.flatMap(day => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(day.date))
            || !Array.isArray(day.points) || !day.points.length
            || !Number.isFinite(Number(day.previous_close))) return [];
        let cumulativeVolume = 0;
        let cumulativeAmount = 0;
        const points = day.points.map(row => {
          const volume = Number(row[2] || 0);
          const amount = Number(row[3] || 0);
          cumulativeVolume += Math.max(0, volume);
          cumulativeAmount += Math.max(0, amount);
          return [
            String(row[0]),Number(row[1]),volume,
            cumulativeVolume > 0 ? cumulativeAmount / cumulativeVolume : null,
          ];
        }).filter(row =>
          /^\d{4}$/.test(row[0]) && Number.isFinite(row[1]) && row[1] > 0);
        return points.length ? [{
          date:String(day.date),previousClose:Number(day.previous_close),
          points,source:day.source || '腾讯/新浪真实分钟快照',
        }] : [];
      });
    }

    function parseDaily(payload, symbol) {
      const rows = payload?.data?.[symbol]?.qfqday;
      if (payload?.code !== 0 || !Array.isArray(rows) || !rows.length) {
        throw new Error('腾讯前复权日K不可用');
      }
      const bars = rows.map(row => ({
        date: String(row[0]), open: Number(row[1]), close: Number(row[2]),
        high: Number(row[3]), low: Number(row[4]), volume: Number(row[5]),
      })).filter(row =>
        /^\d{4}-\d{2}-\d{2}$/.test(row.date)
        && [row.open, row.close, row.high, row.low, row.volume].every(Number.isFinite)
        && Math.min(row.open, row.close, row.high, row.low) > 0);
      if (!bars.length) throw new Error('腾讯前复权日K无有效数据');
      return {bars, marks: [], source: '腾讯在线行情'};
    }

    function parsePublishedDaily(payload, code) {
      if (payload?.schema !== 'awakening-stock-daily-v1'
          || payload.code !== code || !Array.isArray(payload.bars)
          || !payload.bars.length) {
        throw new Error('本地指标日K不可用');
      }
      const bars = payload.bars.map(row => ({
        date:String(row[0]),open:Number(row[1]),high:Number(row[2]),
        low:Number(row[3]),close:Number(row[4]),volume:Number(row[5]),
      })).filter(row =>
        /^\d{4}-\d{2}-\d{2}$/.test(row.date)
        && [row.open,row.high,row.low,row.close,row.volume].every(Number.isFinite)
        && Math.min(row.open,row.high,row.low,row.close)>0);
      const marks = [];
      for (const [source, strength] of [
        [payload.signals || [], 'strong'],
        [payload.filtered_signals || [], 'weak'],
      ]) {
        for (const item of source) {
          const index = Number(item[0]);
          if (!bars[index] || ![1, -1].includes(Number(item[1]))) continue;
          marks.push({
            date:bars[index].date,direction:Number(item[1]),
            probability:Number(item[2]),strength,
          });
        }
      }
      return {bars,marks,source:payload.source || '本地已校验'};
    }

    function mergeDaily(online, published) {
      if (!published) return online;
      if (!online) return published;
      const bars = new Map(
        published.bars.map(row => [row.date, row]));
      for (const row of online.bars) bars.set(row.date, row);
      return {
        bars:[...bars.values()].sort((left,right) =>
          left.date.localeCompare(right.date)),
        marks:published.marks,
        source:'腾讯在线行情 + 本地指标信号',
      };
    }

    function movingAverage(values, period) {
      let total = 0;
      return values.map((value, index) => {
        total += value;
        if (index >= period) total -= values[index - period];
        return index >= period - 1 ? total / period : null;
      });
    }

    function volumeDirections(points, previousClose) {
      let previous = Number(previousClose);
      return points.map(point => {
        const current = Number(point[1]);
        const value = current > previous ? 1 : current < previous ? -1 : 0;
        previous = current;
        return value;
      });
    }

    function signalMarks(points, rows, date) {
      const times = new Set(points.map(point => point[0]));
      return rows.filter(row =>
        String(row.quote_at || '').slice(0,10) === date).flatMap(row => {
        const match = String(row.quote_at || '').match(/T(\d{2}):(\d{2})/);
        const rawAt = match ? `${match[1]}${match[2]}` : '';
        if (!times.has(rawAt)) return [];
        const at = `${rawAt.slice(0, 2)}:${rawAt.slice(2)}`;
        const long = row.direction === 1;
        const chartPrice = Number.isFinite(Number(row.qfq_price))
          ? Number(row.qfq_price) : Number(row.price);
        return [{
          name: long ? '多' : '空',
          coord: [at, chartPrice],
          value: `${long ? '多' : '空'} ${clock(row.quote_at)} ${price(row.price)}`,
          symbol: 'circle', symbolSize: 10,
          symbolOffset: [0, long ? '-55%' : '55%'],
          itemStyle: {color: long ? '#ef6666' : '#3fc28b',
            borderColor:'#101619',borderWidth:1},
          label: {show: true, position: long ? 'top' : 'bottom',
            distance:8,fontSize:9,
            color: long ? '#ef6666' : '#3fc28b',
            backgroundColor: 'rgba(13,17,19,.92)',borderRadius: 3,
            padding: [2,3],formatter: `${long ? '多' : '空'}\n${clock(row.quote_at)}\n${price(row.price)}`},
        }];
      });
    }

    function drawMinute(data) {
      const points = data.points;
      const times = points.map(row => `${row[0].slice(0,2)}:${row[0].slice(2)}`);
      const values = points.map(row => row[1]);
      const volumes = points.map(row => row[2]);
      const averages = points.map(row => row[3]);
      const directions = volumeDirections(points, data.previousClose);
      const span = Math.max(
        data.previousClose * .003,
        ...values.map(value => Math.abs(value - data.previousClose))) * 1.12;
      stockChart.setOption({
        animation: false,
        tooltip: {trigger: 'axis',confine:true,formatter:items => {
          const index = items[0]?.dataIndex;
          if (index == null) return '';
          const value = values[index];
          const change = value / data.previousClose - 1;
          return `${data.date} ${times[index]}<br>价格 ${price(value)}`
            + `<br>涨跌幅 ${pct(change)}`
            + (Number.isFinite(averages[index])
              ? `<br>均价 ${price(averages[index])}` : '')
            + `<br>成交量 ${Number(volumes[index]).toLocaleString('zh-CN')} 股`;
        }},
        legend: {top: 0, right: 8, textStyle: {color: '#9ba9af'}},
        grid: [
          {left: 62, right: 18, top: 54, height: '55%'},
          {left: 62, right: 18, top: '76%', height: '13%'},
        ],
        xAxis: [
          {...axis,type:'category',data:times,boundaryGap:false,
            axisLabel:{color:'#9ba9af',interval:59}},
          {...axis,type:'category',data:times,boundaryGap:true,gridIndex:1,
            axisLabel:{show:false}},
        ],
        yAxis: [
          {...axis,type:'value',
            min:Math.max(.01,data.previousClose-span),max:data.previousClose+span,
            axisLabel:{formatter:value=>`${((value/data.previousClose-1)*100).toFixed(2)}%`}},
          {...axis,type:'value',gridIndex:1,axisLabel:{show:false}},
        ],
        series: [
          {name:'价格',type:'line',data:values,showSymbol:false,
            lineStyle:{color:'#78a8e8',width:2},itemStyle:{color:'#78a8e8'},
            markPoint:{data:signalMarks(points,stockState.signals,data.date)},
            markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#e4b95c'},
              label:{formatter:'0.00%',color:'#e4b95c'},
              data:[{yAxis:data.previousClose}]}},
          {name:'均价',type:'line',data:averages,showSymbol:false,
            lineStyle:{color:'#e4b95c',width:1.3},itemStyle:{color:'#e4b95c'}},
          {name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,
            data:volumes.map((value,index)=>({value,itemStyle:{color:
              directions[index]>0?'rgba(239,102,102,.72)':
              directions[index]<0?'rgba(63,194,139,.72)':'rgba(155,169,175,.45)'}}))},
        ],
      }, true);
      $('#chart-status').textContent =
        `${data.date} · ${data.source} · 昨收 ${price(data.previousClose)}`;
    }

    function drawDaily(data) {
      const rows = data.bars;
      const dates = rows.map(row => row.date);
      const currentMarks = stockState.signals.map(row => ({
        date:row.quote_at.slice(0,10),direction:row.direction,
        strength:row.strength,probability:row.probability,
        price:Number(row.qfq_price),time:clock(row.quote_at),live:true,
      }));
      const seen = new Set(currentMarks.map(row =>
        `${row.date}/${row.direction}/${row.strength}`));
      const allMarks = [
        ...(data.marks || []).filter(row =>
          !seen.has(`${row.date}/${row.direction}/${row.strength}`)),
        ...currentMarks,
      ];
      const marks = allMarks.flatMap(row => {
        const index = dates.indexOf(row.date);
        if (index < 0) return [];
        const long = row.direction === 1;
        const strong = row.strength !== 'weak';
        const label = signalLabel(row.direction, row.strength);
        const color = long
          ? (strong ? signalColors.strongLong : signalColors.weakLong)
          : (strong ? signalColors.strongShort : signalColors.weakShort);
        const mark = {
          name:row.live ? `盘中首${label}` : label,
          coord:[index,long ? rows[index].low : rows[index].high],
          value:label,
          symbol:row.live ? 'diamond' : 'circle',
          symbolSize:row.live ? 22 : (strong ? 28 : 22),
          itemStyle:{
            color,borderColor:'#101619',
            borderWidth:row.live ? 2 : (strong ? 2 : 1),
            opacity:strong ? 1 : .9,
          },
          label:{show:true,color:'#ffffff',
            fontSize:row.live ? 9 : (strong ? 11 : 9),
            fontWeight:700,formatter:label},
        };
        if (!row.live) {
          mark.symbolOffset = [0,long?'68%':'-68%'];
        }
        return [mark];
      });
      const closes = rows.map(row => row.close);
      const ma5 = movingAverage(closes, 5);
      const ma10 = movingAverage(closes, 10);
      const ma20 = movingAverage(closes, 20);
      stockChart.setOption({
        animation:false,tooltip:{trigger:'axis',confine:true,formatter:items => {
          const index = items[0]?.dataIndex;
          const row = rows[index];
          if (!row) return '';
          return `${row.date}<br>开 ${price(row.open)}　收 ${price(row.close)}`
            + `<br>高 ${price(row.high)}　低 ${price(row.low)}`
            + (ma5[index] == null ? '' : `<br>MA5 ${price(ma5[index])}`)
            + (ma10[index] == null ? '' : `　MA10 ${price(ma10[index])}`)
            + (ma20[index] == null ? '' : `　MA20 ${price(ma20[index])}`);
        }},
        legend:{top:0,right:8,data:['MA5','MA10','MA20'],
          textStyle:{color:'#9ba9af'}},
        grid:[
          {left:62,right:18,top:48,height:'58%'},
          {left:62,right:18,top:'76%',height:'11%'},
        ],
        xAxis:[
          {...axis,type:'category',data:dates,boundaryGap:true,
            axisLabel:{show:false}},
          {...axis,type:'category',data:dates,boundaryGap:true,gridIndex:1,
            axisLabel:{color:'#9ba9af',interval:0,rotate:45,
              formatter:value=>value.slice(5)}},
        ],
        yAxis:[
          {...axis,type:'value',scale:true},
          {...axis,type:'value',scale:true,gridIndex:1,axisLabel:{show:false}},
        ],
        dataZoom:[{type:'inside',xAxisIndex:[0,1],start:45,end:100},
          {type:'slider',xAxisIndex:[0,1],height:16,bottom:4,start:45,end:100}],
        series:[
          {name:'日K',type:'candlestick',
            data:rows.map(row=>[row.open,row.close,row.low,row.high]),
            itemStyle:{color:'#ef6666',color0:'#3fc28b',
              borderColor:'#ef6666',borderColor0:'#3fc28b'},
            markPoint:{silent:true,data:marks}},
          {name:'MA5',type:'line',data:ma5,showSymbol:false,
            lineStyle:{width:1.3,color:'#e4b95c'}},
          {name:'MA10',type:'line',data:ma10,showSymbol:false,
            lineStyle:{width:1.3,color:'#67d7dc'}},
          {name:'MA20',type:'line',data:ma20,showSymbol:false,
            lineStyle:{width:1.3,color:'#b98be3'}},
          {name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,
            data:rows.map(row=>({value:row.volume,itemStyle:{color:
              row.close>=row.open?'rgba(239,102,102,.58)':'rgba(63,194,139,.58)'}}))},
        ],
      },true);
      stockChart.off('click');
      stockChart.on('click', params => {
        if (params.seriesType !== 'candlestick'
            || params.seriesName !== '日K') return;
        const date = dates[params.dataIndex];
        if (date) setStockView('minute', date);
      });
      const strongCount = allMarks.filter(row =>
        row.strength !== 'weak').length;
      const weakCount = allMarks.length - strongCount;
      $('#chart-status').textContent =
        `${data.source} · 前复权日K ${rows[0].date} 至 ${rows.at(-1).date}`
        + ` · 强多空 ${strongCount} · 弱多空 ${weakCount}`
        + ' · 点击K线查看对应日期分时（仅真实1分钟留存日可用）';
    }

    async function requestStockJson(url, state, view) {
      stockController?.abort();
      const controller = new AbortController();
      stockController = controller;
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(url, {
          cache:'no-store',credentials:'omit',signal:controller.signal,
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        return stockState === state && state.view === view ? payload : null;
      } finally {
        clearTimeout(timeout);
        if (stockController === controller) stockController = null;
      }
    }

    function dailyPreviousClose(daily, date) {
      const index = (daily?.bars || []).findIndex(row => row.date === date);
      return index > 0 ? Number(daily.bars[index - 1].close) : null;
    }

    function dailyClose(daily, date) {
      const row = (daily?.bars || []).find(item => item.date === date);
      return row ? Number(row.close) : null;
    }

    async function loadMinute(state, requestedDate = '') {
      $('#chart-status').textContent = '正在读取腾讯/新浪真实1分钟行情';
      const symbol = `${state.code.startsWith('6') ? 'sh' : 'sz'}${state.code}`;
      const days = new Map();
      try {
        const response = await fetch(
          `live/${state.code.slice(0,2)}/${state.code}.json`,
          {cache:'no-cache'});
        if (response.ok) {
          for (const item of parsePersistedMinutes(
              await response.json(), state.code)) {
            days.set(item.date, item);
          }
        }
      } catch (_) {}
      if (!requestedDate || !days.has(requestedDate)) {
        try {
          const payload = await requestStockJson(
            `https://web.ifzq.gtimg.cn/appstock/app/day/query?code=${symbol}&_=${Date.now()}`,
            state, 'minute');
          for (const item of payload?.data?.[symbol]?.data || []) {
            const compact = String(item?.date || '');
            const date = /^\d{8}$/.test(compact)
              ? `${compact.slice(0,4)}-${compact.slice(4,6)}-${compact.slice(6)}`
              : '';
            const previousClose = dailyPreviousClose(state.daily, date);
            if (!date || !Number.isFinite(previousClose)) continue;
            try {
              const parsed = parseMinute(
                payload, symbol, compact, previousClose,
                dailyClose(state.daily, date));
              days.set(parsed.date, parsed);
            } catch (_) {}
          }
        } catch (_) {}
      }
      if (!days.size) throw new Error('没有腾讯/新浪真实1分钟数据');
      state.minute = days;
    }

    async function loadDaily(state) {
      $('#chart-status').textContent = '正在读取腾讯前复权日K';
      const symbol = `${state.code.startsWith('6') ? 'sh' : 'sz'}${state.code}`;
      const param = encodeURIComponent(`${symbol},day,,,120,qfq`);
      let published = null;
      try {
        const response = await fetch(
          `stocks/${state.code.slice(0,2)}/${state.code}.json`,
          {cache:'no-cache'});
        if (response.ok) {
          published = parsePublishedDaily(
            await response.json(), state.code);
        }
      } catch (_) {}
      let online = null;
      try {
        const payload = await requestStockJson(
          `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${param}&_=${Date.now()}`,
          state, 'daily');
        if (payload) online = parseDaily(payload, symbol);
      } catch (error) {
        if (!published) throw error;
      }
      if (stockState !== state || state.view !== 'daily') return;
      state.daily = mergeDaily(online, published);
      if (!state.daily) throw new Error('日K数据不可用');
      drawDaily(state.daily);
    }

    async function setStockView(view, requestedDate = '') {
      const state = stockState;
      if (!state) return;
      try {
        if (view === 'minute') {
          state.view = 'minute';
          if (!state.minute) await loadMinute(state, requestedDate);
          if (stockState !== state) return;
          const dates = [...state.minute.keys()].sort();
          const target = requestedDate || state.date || dates.at(-1);
          if (!state.minute.has(target)) {
            state.view = 'daily';
            view = 'daily';
            if (!state.daily) await loadDaily(state);
            else drawDaily(state.daily);
            $('#chart-status').textContent =
              `${target} 没有腾讯/新浪真实1分钟数据，已切换日K`;
          } else {
            state.date = target;
            drawMinute(state.minute.get(target));
          }
        } else {
          state.view = 'daily';
          if (!state.daily) await loadDaily(state);
          else drawDaily(state.daily);
        }
        $('#minute-tab').classList.toggle('active', view === 'minute');
        $('#daily-tab').classList.toggle('active', view === 'daily');
        $('#minute-tab').setAttribute(
          'aria-selected', String(view === 'minute'));
        $('#daily-tab').setAttribute(
          'aria-selected', String(view === 'daily'));
      } catch (error) {
        if (error?.name === 'AbortError' || stockState !== state) return;
        $('#chart-status').textContent = `行情读取失败 · ${String(error)}`;
        if (!state.daily || view === 'daily') stockChart.clear();
      }
    }

    function openStock(code) {
      const signals = stockSignals(code);
      if (!signals.length) return;
      const summary = signals[0];
      stockState = {code,name:signals[0].name,signals,view:'minute',
        minute:null,daily:null,date:summary.quote_at.slice(0,10)};
      $('#stock-title').textContent = signals[0].name;
      const signalText = signals.map(row => {
        const label = row.direction === 1 ? '多头' : '空头';
        const vanished = row.disappeared_at_close
          ? ` <span class="badge">${label}收盘消失</span>` : '';
        return `${label} ${esc(clock(row.quote_at))} ${price(row.price)}`
          + `（信号时 ${pct(row.change)}，至收盘 ${pct(row.signal_to_close)}）`
          + vanished;
      }).join('　');
      $('#stock-code').innerHTML =
        `<strong>${esc(code)}</strong> · ${signalText}<br>`
        + `收盘 ${price(summary.close_price)}（${pct(summary.close_change)}）`
        + `　最高 ${price(summary.high)}　最低 ${price(summary.low)}`
        + `　最大涨幅 ${pct(summary.max_rise)}　最大跌幅 ${pct(summary.max_decline)}`;
      if (!$('#stock-dialog').open) $('#stock-dialog').showModal();
      if (!stockChart) stockChart = echarts.init($('#stock-chart'));
      setStockView('minute', stockState.date);
    }

    function dayLabel(day) {
      return /^\d{8}$/.test(String(day))
        ? `${day.slice(0,4)}-${day.slice(4,6)}-${day.slice(6)}`
        : String(day || '--');
    }

    function renderDateSelector(data, day) {
      const dates = [...new Set(data.available_dates || [])]
        .filter(value => /^\d{8}$/.test(String(value)))
        .sort().reverse();
      $('#date-select').innerHTML = dates.map(value =>
        `<option value="${value}">${dayLabel(value)}</option>`).join('');
      $('#date-select').value = day;
    }

    function render(data) {
      if (data?.schema !== 'awakening-consensus-dashboard-v1'
          || !data.board || !data.policy
          || !Array.isArray(data.available_dates)
          || !Array.isArray(data.signals?.rows)) {
        throw new Error('数据结构不兼容');
      }
      DATA = data;
      const day = String(data.signals.date || '');
      activeDate = day;
      DATE_CACHE.set(day, data);
      signalPage = 1;
      if ($('#stock-dialog').open) $('#stock-dialog').close();
      $('#generated').textContent = `快照 ${stamp(data.generated)}`;
      $('#signal-date').textContent = /^\d{8}$/.test(day)
        ? `交易日 ${dayLabel(day)}`
        : '交易日 --';
      $('#signal-through').textContent =
        `多空信号观测至 ${stamp(data.signals.observed_through)}`;
      renderDateSelector(data, day);
      renderConsensus();
      renderSignals();
    }

    async function loadDate(day, force = false) {
      if (!/^\d{8}$/.test(String(day))) return;
      const prior = activeDate;
      const select = $('#date-select');
      select.disabled = true;
      $('#generated').textContent = `正在读取 ${dayLabel(day)}`;
      try {
        if (!force && DATE_CACHE.has(day)) {
          render(DATE_CACHE.get(day));
          return;
        }
        const response = await fetch(
          `history/${day}.json`, {cache:'no-cache'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        select.value = prior;
        $('#generated').textContent =
          `历史数据读取失败 · ${String(error)}`;
      } finally {
        select.disabled = false;
      }
    }

    async function refresh() {
      const button = $('#refresh');
      button.disabled = true;
      try {
        if (
            activeDate
            && DATA?.latest_date
            && activeDate !== DATA.latest_date) {
          await loadDate(activeDate, true);
          return;
        }
        const headers = etag ? {'If-None-Match': etag} : {};
        let response = await fetch('data.json', {cache:'no-cache',headers});
        if (!response.ok && location.hostname === '127.0.0.1') {
          response = await fetch('/api/data', {cache:'no-store'});
        }
        if (response.status === 304) return;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        etag = response.headers.get('ETag') || '';
        render(await response.json());
      } catch (error) {
        $('#generated').textContent = `刷新失败 · ${String(error)}`;
      } finally {
        button.disabled = false;
      }
    }

    $('#refresh').addEventListener('click', refresh);
    $('#date-select').addEventListener('change', event =>
      loadDate(event.target.value));
    $('#signal-search').addEventListener('input', () => {
      signalPage = 1; renderSignals();
    });
    document.querySelectorAll('[data-direction]').forEach(button =>
      button.addEventListener('click', () => {
        direction = button.dataset.direction;
        signalPage = 1;
        document.querySelectorAll('[data-direction]').forEach(node =>
          {
            node.classList.toggle('active', node === button);
            node.setAttribute(
              'aria-selected', String(node === button));
          });
        renderSignals();
      }));
    $('#signal-prev').addEventListener('click', () => {
      signalPage -= 1; renderSignals();
    });
    $('#signal-next').addEventListener('click', () => {
      signalPage += 1; renderSignals();
    });
    $('#signals-table').addEventListener('click', event => {
      const link = event.target.closest('[data-code]');
      if (link) openStock(link.dataset.code);
    });
    $('#consensus-section').addEventListener('click', event => {
      const link = event.target.closest('[data-code]');
      if (link) openStock(link.dataset.code);
    });
    $('#minute-tab').addEventListener('click', () => setStockView('minute'));
    $('#daily-tab').addEventListener('click', () => setStockView('daily'));
    $('#stock-close').addEventListener('click', () => $('#stock-dialog').close());
    $('#stock-dialog').addEventListener('close', () => {
      stockController?.abort();
      stockController = null;
      stockState = null;
      stockChart?.dispose();
      stockChart = null;
    });
    window.addEventListener('resize', () => stockChart?.resize());
    refresh();
  </script>
</body>
</html>
